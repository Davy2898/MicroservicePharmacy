services:
  # ---------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pharmacy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pharmacy_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123123}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharmacy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pharmacy_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # One-shot schema/seed job (creates tables before the services boot)
  # ---------------------------------------------------------------------
  db-init:
    build:
      context: ./vue-project/pharmacy-backend
      dockerfile: Dockerfile
    container_name: pharmacy-db-init
    restart: "no"
    command: ["node", "init-db.js"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123123}
      DB_NAME: ${DB_NAME:-pharmacy_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmacy-net

  # ---------------------------------------------------------------------
  # Category Service (extracted microservice)
  # ---------------------------------------------------------------------
  category-service:
    build:
      context: ./pharmacy-category-service
      dockerfile: Dockerfile
    container_name: pharmacy-category-service
    restart: unless-stopped
    environment:
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123123}
      DB_NAME: ${DB_NAME:-pharmacy_db}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    networks:
      - pharmacy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------
  # Monolith Backend
  # ---------------------------------------------------------------------
  pharmacy-backend:
    build:
      context: ./vue-project/pharmacy-backend
      dockerfile: Dockerfile
    container_name: pharmacy-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123123}
      DB_NAME: ${DB_NAME:-pharmacy_db}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    networks:
      - pharmacy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/api/test-db || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------
  # Vue.js Frontend (built assets served by NGINX, /api proxied internally)
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./vue-project
      dockerfile: Dockerfile.frontend
    container_name: pharmacy-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - pharmacy-net
    depends_on:
      pharmacy-backend:
        condition: service_started
      category-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------
  # NGINX API Gateway (production-style routing)
  # ---------------------------------------------------------------------
  api-gateway:
    image: nginx:alpine
    container_name: pharmacy-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pharmacy-net
    depends_on:
      - pharmacy-backend
      - category-service
      - frontend

networks:
  pharmacy-net:
    driver: bridge

volumes:
  postgres_data:

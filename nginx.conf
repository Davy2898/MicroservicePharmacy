events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker's embedded DNS, so upstreams resolve even if a container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream category_service {
        server category-service:5001;
    }

    upstream pharmacy_backend {
        server pharmacy-backend:5000;
    }

    upstream pharmacy_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Gateway health check
        location = /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Category endpoints -> category microservice.
        # NOTE: no trailing slash on proxy_pass, so the original /api/categories
        # path is forwarded untouched (the service exposes /api/categories).
        location /api/categories {
            proxy_pass http://category_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else under /api -> monolith backend
        location /api/ {
            proxy_pass http://pharmacy_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> frontend container (built Vue app)
        location / {
            proxy_pass http://pharmacy_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
